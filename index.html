<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Registro</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <section id="formulario">
        <form name="frmregistro" method="post" action="#">
            <h1>FORMULARIO DE REGISTRO</h1>
            <p class="descripcion">Complete el formulario con sus datos</p>
            <table>
                <tr>
                    <td><label for="txtnombres">Nombres y apellidos</label></td>
                    <td><input type="text" id="txtnombres" name="txtnombres" placeholder="Ingrese datos completos" required></td>
                </tr>
                <tr>
                    <td><label for="txtdni">DNI</label></td>
                    <td><input type="text" id="txtdni" name="txtdni" placeholder="8 caracteres" disabled></td>
                </tr>
                <tr>
                    <td><label for="txtfono">Teléfono</label></td>
                    <td><input type="tel" id="txtfono" name="txtfono"></td>
                </tr>
                <tr>
                    <td><label>Estudios realizados</label></td>
                    <td>
                        <input type="checkbox" name="chkprimaria" checked> Primaria
                        <input type="checkbox" name="chksecundaria"> Secundaria<br>
                        <input type="checkbox" name="chktecnico"> Técnico
                        <input type="checkbox" name="chkuniversitario"> Universitario
                    </td>
                </tr>
                <tr>
                    <td><label>Estado civil</label></td>
                    <td>
                        <input type="radio" name="btnestado" value="s" checked> Soltero
                        <input type="radio" name="btnestado" value="c"> Casado
                        <input type="radio" name="btnestado" value="v"> Viudo
                        <input type="radio" name="btnestado" value="d"> Divorciado
                    </td>
                </tr>
                <tr>
                    <td><label for="txtprovincia">Provincia</label></td>
                    <td>
                        <input type="text" name="txtprovincia" list="provincias">
                        <datalist id="provincias">
                            <option value="Lima">
                            <option value="Arequipa">
                            <option value="Tacna">
                            <option value="Trujillo">
                            <option value="Huancayo">
                        </datalist>
                    </td>
                </tr>
                <tr>
                    <td><label for="txtemail">Correo electrónico</label></td>
                    <td><input type="email" name="txtemail" id="txtemail"></td>
                </tr>
                <tr>
                    <td><label for="txtclave">Clave personal</label></td>
                    <td><input type="password" name="txtclave" id="txtclave" placeholder="Máximo 6 caracteres"></td>
                </tr>
                <tr>
                    <td><label for="txtcolor">Color de preferencia</label></td>
                    <td><input type="color" name="txtcolor" id="txtcolor"></td>
                </tr>
                <tr>
                    <td><label for="txtfecha">Fecha de nacimiento</label></td>
                    <td><input type="datetime-local" name="txtfecha" id="txtfecha"></td>
                </tr>
                <tr>
                    <td colspan="2" style="text-align: center;">
                        <input type="submit" value="Registrar">
                        <input type="reset" value="Limpiar">
                    </td>
                </tr>
            </table>
        </form>
    </section>
</body>
</html>
